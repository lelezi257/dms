id = "remote-b-r1"
fs = "all"
meta_endpoint = "https://192.168.109.11:22800"
grpc_listen = "0.0.0.0:22900"
rest_listen = "0.0.0.0:22901"
advertise_endpoint = "https://192.168.109.13:22900"
data_dir = "/var/lib/afs/node"
uds_path = "/run/afs/node.sock"
dfs_mount = "/mnt/afs/dfs"
ownerfs_mount = "/mnt/afs/ownerfs"
data_mode = "grpc"
allow_volatile_meta = false
dfs_desired_copies = 2
dfs_sync_required_copies = 2
dfs_min_distinct_nodes = 2
dfs_min_distinct_failure_domains = 2
dfs_local_copy = "required"
log_level = "info"
trace_enabled = false

tls_ca_certificate = "/etc/afs/tls/ca.pem"
tls_identity_certificate = "/etc/afs/tls/remote-b-r1.pem"
tls_identity_private_key = "/etc/afs/tls/remote-b-r1-key.pem"
tls_server_name = "afs-meta"
trusted_node_certs = { remote-a-r1 = "/etc/afs/tls/remote-a-r1.pem", remote-b-r1 = "/etc/afs/tls/remote-b-r1.pem" }
