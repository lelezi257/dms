<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img"><title>One chunk interface, configurable replicas</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#526575"/></marker></defs><rect width="1100" height="600" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183246}.small{font-size:16px}.label{font-size:20px}.title{font-size:25px;font-weight:bold}.mono{font-family:Menlo,monospace;font-size:15px}</style><text x="35" y="42" class="title" text-anchor="start">One chunk interface, configurable replicas</text><rect x="40" y="85" width="310" height="75" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="56" y="115" class="label" text-anchor="start">ChunkStore.put_batch</text><text x="56" y="142" class="small" text-anchor="start">Same immutable ChunkId</text><path d="M350 123 L485 123" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="485" y="80" width="565" height="95" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="501" y="110" class="label" text-anchor="start">ReplicationConfig</text><text x="501" y="137" class="small" text-anchor="start">N = desired durable copies; M = copies required before commit</text><text x="501" y="160" class="small" text-anchor="start">Example only: N=3, M=3. R1 uses N=M=1.</text><text x="40" y="245" class="label" text-anchor="start">R1</text><rect x="165" y="210" width="240" height="85" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="181" y="240" class="label" text-anchor="start">Local A</text><text x="181" y="267" class="small" text-anchor="start">Finalize + durable ACK</text><path d="M405 250 L830 250" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><text x="617.5" y="241.0" class="small" text-anchor="middle">receipt</text><rect x="830" y="210" width="220" height="85" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="846" y="240" class="label" text-anchor="start">Meta commit</text><text x="846" y="267" class="small" text-anchor="start">FileVersion + head</text><text x="40" y="400" class="label" text-anchor="start">RN</text><rect x="165" y="355" width="205" height="90" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="181" y="385" class="label" text-anchor="start">A: local</text><text x="181" y="412" class="small" text-anchor="start">Finalize same chunk</text><rect x="425" y="355" width="205" height="90" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="441" y="385" class="label" text-anchor="start">B: peer</text><text x="441" y="412" class="small" text-anchor="start">Finalize same chunk</text><rect x="685" y="355" width="205" height="90" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="701" y="385" class="label" text-anchor="start">C: peer</text><text x="701" y="412" class="small" text-anchor="start">Finalize same chunk</text><path d="M370 398 L425 398" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M630 398 L685 398" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M685 470 L200 470" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><text x="442.5" y="461.0" class="small" text-anchor="middle">ACK after required copies</text><text x="40" y="550" class="small" text-anchor="start">Replication changes below the file layout. A failed barrier cannot publish a successful commit.</text></svg>