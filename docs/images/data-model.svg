<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img"><title>A file is a mapping to immutable data</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#526575"/></marker></defs><rect width="1100" height="600" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183246}.small{font-size:16px}.label{font-size:20px}.title{font-size:25px;font-weight:bold}.mono{font-family:Menlo,monospace;font-size:15px}</style><text x="35" y="42" class="title" text-anchor="start">A file is a mapping to immutable data</text><rect x="40" y="90" width="260" height="90" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="56" y="120" class="label" text-anchor="start">InodeRecord</text><text x="56" y="147" class="small" text-anchor="start">inode = 42</text><text x="56" y="170" class="small" text-anchor="start">head_version = V8</text><rect x="410" y="90" width="290" height="90" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="426" y="120" class="label" text-anchor="start">FileVersion V8</text><text x="426" y="147" class="small" text-anchor="start">length = 12 MiB</text><text x="426" y="170" class="small" text-anchor="start">layout = immutable mapping</text><path d="M300 135 L410 135" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="80" y="260" width="920" height="100" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="96" y="290" class="label" text-anchor="start">ExtentMap</text><text x="96" y="317" class="small" text-anchor="start">file [0, 4 MiB) -&gt; C1     |     [4, 8 MiB) -&gt; C2     |     [8, 12 MiB) -&gt; C3</text><path d="M555 180 L555 260" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="100" y="440" width="230" height="75" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="116" y="470" class="label" text-anchor="start">Chunk C1</text><text x="116" y="497" class="small" text-anchor="start">Bytes identified by ChunkId</text><path d="M215 360 L215 440" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="415" y="440" width="230" height="75" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="431" y="470" class="label" text-anchor="start">Chunk C2</text><text x="431" y="497" class="small" text-anchor="start">Bytes identified by ChunkId</text><path d="M530 360 L530 440" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="730" y="440" width="230" height="75" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="746" y="470" class="label" text-anchor="start">Chunk C3</text><text x="746" y="497" class="small" text-anchor="start">Bytes identified by ChunkId</text><path d="M845 360 L845 440" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><text x="45" y="560" class="small" text-anchor="start">Large mappings may use LayoutRoot; it locates the mapping, not the file bytes.</text></svg>