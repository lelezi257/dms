name: AFS Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 验证源码、维护中的测试工具及打包边界；不替代真实 FUSE/E2E 验收。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node.js 24
        with:
          persist-credentials: false
      - name: Load pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install Linux protocol and RDMA headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libibverbs-dev libfuse3-dev fuse3 pkg-config python3-venv
      - name: Prepare isolated acceptance dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/afs-tools-venv"
          "$RUNNER_TEMP/afs-tools-venv/bin/python" -m pip install -r tests/acceptance/requirements.txt
      - name: Dependency preflight
        id: preflight
        run: |
          pkg-config --modversion fuse3 libibverbs
          protoc --version
          "$RUNNER_TEMP/afs-tools-venv/bin/python" -c 'import hypothesis; assert hypothesis.__version__ == "6.168.3"'
          command -v fusermount3 findmnt flock openssl cc
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Backend feature matrix
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: bash tests/feature-matrix.sh
      - name: Build product processes and test examples
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: cargo build --locked --workspace --all-features --bins --examples
      - name: Acceptance tool regressions
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/afs-tools-venv/bin/python" -m unittest discover -s tests/acceptance -p 'test_*.py'
          sudo env PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/afs-tools-venv/bin/python" -m unittest discover -s tests/acceptance/probes -p 'test_*.py'
      - name: Package and installer regressions
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: |
          bash scripts/deploy/test-package-reproducible.sh
          bash scripts/deploy/selftest.sh
