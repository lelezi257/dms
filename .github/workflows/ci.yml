name: AFS Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 验证源码、维护中的测试工具及打包边界；不替代真实 FUSE/E2E 验收。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node.js 24
        with:
          persist-credentials: false
      - name: Load pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install Linux protocol and RDMA headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libibverbs-dev pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Backend feature matrix
        run: bash tests/feature-matrix.sh
      - name: Build product processes and test examples
        run: cargo build --locked --workspace --all-features --bins --examples
      - name: Acceptance tool regressions
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/acceptance -p 'test_*.py'
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/acceptance/probes -p 'test_*.py'
      - name: Package and installer regressions
        run: |
          bash scripts/deploy/test-package-reproducible.sh
          bash scripts/deploy/selftest.sh
