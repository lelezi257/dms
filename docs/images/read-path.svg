<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img"><title>Read one fixed version from eligible sources</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#526575"/></marker></defs><rect width="1100" height="640" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183246}.small{font-size:16px}.label{font-size:20px}.title{font-size:25px;font-weight:bold}.mono{font-family:Menlo,monospace;font-size:15px}</style><text x="35" y="42" class="title" text-anchor="start">Read one fixed version from eligible sources</text><rect x="35" y="85" width="285" height="90" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="51" y="115" class="label" text-anchor="start">Fixed FileVersion</text><text x="51" y="142" class="small" text-anchor="start">length + immutable layout</text><rect x="425" y="85" width="285" height="90" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="441" y="115" class="label" text-anchor="start">Resolve ranges</text><text x="441" y="142" class="small" text-anchor="start">ChunkId + offset + length</text><path d="M320 130 L425 130" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="40" y="285" width="295" height="95" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="56" y="315" class="label" text-anchor="start">Local</text><text x="56" y="342" class="small" text-anchor="start">Durable copy / verified cache</text><path d="M565 175 L187 285" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="400" y="285" width="295" height="95" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="416" y="315" class="label" text-anchor="start">Peer</text><text x="416" y="342" class="small" text-anchor="start">Eligible replica / live seed</text><path d="M565 175 L547 285" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="760" y="285" width="295" height="95" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="776" y="315" class="label" text-anchor="start">External</text><text x="776" y="342" class="small" text-anchor="start">Committed spill copy</text><path d="M565 175 L907 285" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="290" y="455" width="545" height="90" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="306" y="485" class="label" text-anchor="start">Return requested bytes</text><text x="306" y="512" class="small" text-anchor="start">EOF / holes follow the fixed layout; failed sources can be retried</text><path d="M187 380 L560 455" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M547 380 L560 455" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M907 380 L560 455" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><text x="40" y="590" class="small" text-anchor="start">Only a complete chunk with verified identity becomes a cache copy or a P2P seed.</text></svg>