name: AFS foundation CI

on:
  push:
    branches: [main, feat/agent-workloads-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 验证正式基础框架；完整文件业务后续实施。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node.js 24
        with:
          persist-credentials: false
      - name: Load pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install Linux protocol and RDMA headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libibverbs-dev pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Backend feature matrix
        run: bash tests/feature-matrix.sh
      - name: Build foundation processes and SDK example
        run: cargo build --locked --workspace --all-features --bins --examples
      - name: Real process gRPC and SHM acceptance
        run: python3 tests/foundation_e2e.py --bin-dir target/debug --skip-fuse --output /tmp/afs-foundation-evidence
