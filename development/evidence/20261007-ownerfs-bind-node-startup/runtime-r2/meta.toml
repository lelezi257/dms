id = "meta-ctl"
fs = "ownerfs"
meta_store = "memory"
data_dir = "/opt/afs-bind-node-startup-20261007-r2/state/meta"
grpc_listen = "127.0.0.1:24800"
rest_listen = "127.0.0.1:24801"
log_level = "info"
trace_enabled = false
dfs_desired_copies = 1
dfs_sync_required_copies = 1
dfs_min_distinct_nodes = 1
dfs_min_distinct_failure_domains = 1
dfs_local_copy = "required"

tls_ca_certificate = "/opt/afs-bind-node-startup-20261007-r2/etc/tls/ca.pem"
tls_identity_certificate = "/opt/afs-bind-node-startup-20261007-r2/etc/tls/meta.pem"
tls_identity_private_key = "/opt/afs-bind-node-startup-20261007-r2/etc/tls/meta-key.pem"
tls_server_name = "afs-meta"
trusted_node_certs = { node-a = "/opt/afs-bind-node-startup-20261007-r2/etc/tls/node-a.pem" }
