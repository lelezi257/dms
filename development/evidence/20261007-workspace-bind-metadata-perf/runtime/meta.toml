id = "meta-ctl"
fs = "all"
meta_store = "local-file"
data_dir = "/opt/afs-workspace-bind-metadata-perf-20261007-r1/state/meta"
grpc_listen = "127.0.0.1:22400"
rest_listen = "127.0.0.1:22401"
log_level = "info"
trace_enabled = false
dfs_desired_copies = 1
dfs_sync_required_copies = 1
dfs_min_distinct_nodes = 1
dfs_min_distinct_failure_domains = 1
dfs_local_copy = "required"

tls_ca_certificate = "/opt/afs-workspace-bind-metadata-perf-20261007-r1/etc/tls/ca.pem"
tls_identity_certificate = "/opt/afs-workspace-bind-metadata-perf-20261007-r1/etc/tls/meta.pem"
tls_identity_private_key = "/opt/afs-workspace-bind-metadata-perf-20261007-r1/etc/tls/meta-key.pem"
tls_server_name = "afs-meta"
trusted_node_certs = { node-a = "/opt/afs-workspace-bind-metadata-perf-20261007-r1/etc/tls/node-a.pem" }
