name: RFC 提案
description: 提出涉及公开语义、持久状态、可靠性或模块边界的变更。
title: "RFC: "
labels: ["kind/rfc", "status/needs-evidence"]
body:
  - type: textarea
    id: user-case
    attributes:
      label: 使用场景
      description: 描述操作、预期结果和失败时的结果。
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 契约
      description: 描述外部语义和需要保持的架构约束。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 依据
      description: 提供源码分析、实验或工作负载数据的可追溯引用。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收出口
      description: 列出功能、失败路径、性能和运行验收要求。
    validations:
      required: true
