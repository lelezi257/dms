<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img"><title>Overwrite creates new data; old data remains unchanged</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#526575"/></marker></defs><rect width="1100" height="570" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183246}.small{font-size:16px}.label{font-size:20px}.title{font-size:25px;font-weight:bold}.mono{font-family:Menlo,monospace;font-size:15px}</style><text x="35" y="42" class="title" text-anchor="start">Overwrite creates new data; old data remains unchanged</text><rect x="40" y="90" width="210" height="75" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="56" y="120" class="label" text-anchor="start">Version V7</text><text x="56" y="147" class="small" text-anchor="start">Old mapping</text><rect x="40" y="245" width="210" height="75" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="56" y="275" class="label" text-anchor="start">Version V8</text><text x="56" y="302" class="small" text-anchor="start">New mapping</text><rect x="425" y="75" width="625" height="105" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="441" y="105" class="label" text-anchor="start">Existing Chunk C1</text><text x="441" y="132" class="small" text-anchor="start">4 MiB of immutable bytes</text><rect x="675" y="240" width="375" height="85" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="691" y="270" class="label" text-anchor="start">Patch Chunk P1</text><text x="691" y="297" class="small" text-anchor="start">4 KiB of new immutable bytes</text><path d="M250 125 L425 125" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M250 280 L425 158" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><text x="337.5" y="210.0" class="small" text-anchor="middle">reuse unchanged ranges</text><path d="M250 285 L675 285" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><text x="462.5" y="276.0" class="small" text-anchor="middle">patch range</text><rect x="75" y="390" width="950" height="90" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="91" y="420" class="label" text-anchor="start">V8 logical bytes</text><text x="91" y="447" class="small" text-anchor="start">C1 [0, 1 MiB)     +     P1 [0, 4 KiB)     +     C1 [1 MiB + 4 KiB, 4 MiB)</text><text x="40" y="535" class="small" text-anchor="start">Compaction can merge mappings later. Retained V7 must keep its referenced chunks.</text></svg>