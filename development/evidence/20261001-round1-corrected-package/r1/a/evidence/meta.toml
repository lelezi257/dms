id = "meta-ctl"
fs = "all"
meta_store = "local-file"
data_dir = "/mnt/lima-afsadata/afs-delivery/round1-mainline-v77-archive-r1/state/meta"
grpc_listen = "127.0.0.1:7400"
rest_listen = "127.0.0.1:7401"
log_level = "info"
trace_enabled = false

tls_ca_certificate = "/mnt/lima-afsadata/afs-delivery/round1-mainline-v77-archive-r1/etc/tls/ca.pem"
tls_identity_certificate = "/mnt/lima-afsadata/afs-delivery/round1-mainline-v77-archive-r1/etc/tls/meta.pem"
tls_identity_private_key = "/mnt/lima-afsadata/afs-delivery/round1-mainline-v77-archive-r1/etc/tls/meta-key.pem"
tls_server_name = "afs-meta"
trusted_node_certs = { node-a = "/mnt/lima-afsadata/afs-delivery/round1-mainline-v77-archive-r1/etc/tls/node-a.pem" }

# For etcd-backed runs:
# meta_store = "etcd"
# etcd_endpoint = "http://127.0.0.1:2379"

# For Redis-backed runs:
# meta_store = "redis"
# redis_endpoint = "redis://127.0.0.1:6379/0"

# Cluster mode: replace the bootstrap local TLS files above with operator-managed
# CA, Meta identity and trusted Node certificates. Do not run multiple Meta
# processes against the same backend without the accepted HA/fencing design.
