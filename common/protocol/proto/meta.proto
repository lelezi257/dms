syntax = "proto3";
package afs.meta.v1;

// Meta 是 afs-meta 的基础入口：连通性探测、节点注册和将来的集群级租约。
// Ping 只证明 gRPC/观测链路可达，不授予根目录访问权。
// RegisterNode 需要持久 MetaStore 后才能承诺注册生效，当前实现必须返回 UNIMPLEMENTED。
service Meta {
  rpc Ping(PingRequest) returns (PingReply);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeReply);
  rpc LookupNode(LookupNodeRequest) returns (LookupNodeReply);
}

message PingRequest {
  string node_id = 1;
}

message PingReply {
  string message = 1;
  string instance = 2;
}

message NodeEndpoint {
  string grpc_addr = 1;
  string data_addr = 2;
  string rest_addr = 3;
}

message NodeDescriptor {
  string node_id = 1;
  NodeEndpoint endpoint = 2;
  map<string, string> labels = 3;
  repeated string capabilities = 4;
  // 每次 afs-node 进程启动生成新身份；同一 node_id 的旧会话不得继续签发授权。
  string session_id = 5;
  repeated DfsStorageDevice storage_devices = 6;
}

message RegisterNodeRequest {
  string request_id = 1;
  NodeDescriptor node = 2;
  uint64 lease_seconds = 3;
}

message RegisterNodeReply {
  string node_id = 1;
  uint64 lease_epoch = 2;
  uint64 expires_at_unix_ms = 3;
}

message LookupNodeRequest {
  string request_id = 1;
  string node_id = 2;
}

message LookupNodeReply {
  NodeDescriptor node = 1;
  uint64 lease_epoch = 2;
  uint64 expires_at_unix_ms = 3;
  bool found = 4;
}

// ===== OwnerFs 根目录归属与访问授权 =====
// OwnerRoots 是 OwnerFs 的粗粒度授权面。Meta 只管理根目录归属、
// 授权代与撤销屏障；每个文件的 inode/dentry/内容仍在 afs-node。
//
// 状态机不变量：
// - root_epoch 标识根目录归属事实的世代，只有持久 MetaStore 条件事务能推进。
// - access_generation 标识真正撤权/删根/Home 会话恢复的围栏代；B 加入不改变 A 的 grant。
// - A 第一次收到 B 的 grant 时向 Meta 验证后缓存；P2P 请求自身不是签名能力票据。
// - 真正撤权须先让 Home 拒绝旧 grant 并 ACK，才可提交撤权；watch 通知本身不是屏障。
// - session_id 是全系统统一的字符串 Node 会话 ID，P2P 和 Meta 不得混用 uint64。
// - 旧 preview 分支只有中心内存协调，缺少 durable grant 与 revoke ACK，不能直接作为本合同。
service OwnerRoots {
  rpc ReserveRoot(ReserveRootRequest) returns (ReserveRootReply);
  rpc ActivateRoot(ActivateRootRequest) returns (ActivateRootReply);
  rpc AbortRoot(AbortRootRequest) returns (AbortRootReply);
  rpc LookupRoot(LookupRootRequest) returns (LookupRootReply);
  rpc ListOwnerRoots(ListOwnerRootsRequest) returns (ListOwnerRootsReply);
  rpc AcquireRoot(AcquireRootRequest) returns (AcquireRootReply);
  rpc ValidateRootAccess(ValidateRootAccessRequest) returns (ValidateRootAccessReply);
  rpc WatchRootCommands(WatchRootCommandsRequest) returns (stream RootCommand);
  rpc AckRevocation(AckRevocationRequest) returns (AckRevocationReply);
  rpc RecoverRoot(RecoverRootRequest) returns (RecoverRootReply);
}

enum RootRight {
  ROOT_RIGHT_UNSPECIFIED = 0;
  ROOT_RIGHT_LOOKUP = 1;
  ROOT_RIGHT_READ = 2;
  ROOT_RIGHT_WRITE = 3;
  ROOT_RIGHT_ADMIN = 4;
}

enum RootCommandType {
  ROOT_COMMAND_TYPE_UNSPECIFIED = 0;
  ROOT_COMMAND_TYPE_REVOKE_ACCESS = 1;
  ROOT_COMMAND_TYPE_INVALIDATE_CACHE = 2;
}

// REVOKE_ACCESS 仅用于真正撤权、根删除或 Home 恢复；B 首次加入不触发。

enum ReserveConflictPolicy {
  RESERVE_CONFLICT_POLICY_UNSPECIFIED = 0;
  RESERVE_CONFLICT_POLICY_FAIL_IF_EXISTS = 1;
  RESERVE_CONFLICT_POLICY_REUSE_IF_SAME_INTENT = 2;
}

message RootAccess {
  string root_id = 1;
  uint64 root_epoch = 2;
  string home_node_id = 3;
  string holder_node_id = 4;
  string session_id = 5;
  uint64 access_generation = 6;
  reserved 7;
  reserved "mode";
  repeated RootRight rights = 8;
  string fencing_token = 9;
  // Home 进程重启后改变；P2P 服务端须与自己的当前会话核对。
  string home_session_id = 10;
}

// RootLocation 是查询结果，不是授权。它告诉调度器或 node 某个 root 当前在哪、
// 属于哪个 epoch；它不包含 rights、fencing token 或 access_generation。
message RootLocation {
  string root_id = 1;
  uint64 root_epoch = 2;
  string home_node_id = 3;
  reserved 4;
  reserved "mode";
  // 只供定位/故障诊断，仍不是授权。旧进程会话不能代替 RootAccess。
  string home_session_id = 5;
}

// RootReservation 是 reserve 阶段的准备记录。Node 拿到它后只能本地 mkdir、
// fsync parent 并携带 prepare_token 调 ActivateRoot；不能凭它读写该 root。
message RootReservation {
  string root_id = 1;
  uint64 root_epoch = 2;
  string home_node_id = 3;
  string session_id = 4;
  string create_intent_id = 5;
  string prepare_token = 6;
}

message ReserveRootRequest {
  string request_id = 1;
  string root_id = 2;
  string preferred_home_node_id = 3;
  string session_id = 4;
  repeated RootRight rights = 5;
  uint64 expected_root_epoch = 6;
  string parent_root_id = 7;
  string create_intent_id = 8;
  ReserveConflictPolicy conflict_policy = 9;
}

message ReserveRootReply {
  RootReservation reservation = 1;
  bool already_reserved_by_same_intent = 2;
}

message ActivateRootRequest {
  string request_id = 1;
  RootReservation reservation = 2;
  string local_prepare_id = 3;
  uint64 parent_fsync_generation = 4;
  bool parent_fsync_complete = 5;
}

message ActivateRootReply {
  RootAccess access = 1;
}

message AbortRootRequest {
  string request_id = 1;
  string root_id = 2;
  uint64 root_epoch = 3;
  string session_id = 4;
  string create_intent_id = 5;
  string reason = 6;
  string prepare_token = 7;
}

message AbortRootReply {}

message LookupRootRequest {
  string request_id = 1;
  string root_id = 2;
}

message LookupRootReply {
  RootLocation location = 1;
  bool found = 2;
}

message ListOwnerRootsRequest {
  string request_id = 1;
  string home_node_id = 2;
}

message ListOwnerRootsReply {
  repeated RootLocation active_roots = 1;
  repeated RootReservation pending_reservations = 2;
  uint64 authority_revision = 3;
}

message AcquireRootRequest {
  string request_id = 1;
  string root_id = 2;
  string requester_node_id = 3;
  string session_id = 4;
  repeated RootRight rights = 5;
  uint64 expected_root_epoch = 6;
  uint64 expected_access_generation = 7;
}

message AcquireRootReply {
  RootAccess access = 1;
}

// Node 数据面只传下面这份出示凭证，不传根权限列表；权限只能从 Meta
// 验证成功后返回的完整 RootAccess 取得，不能相信远端自报的 rights。
message PresentedRootAccess {
  string root_id = 1;
  uint64 root_epoch = 2;
  string home_node_id = 3;
  string holder_node_id = 4;
  string session_id = 5;
  uint64 access_generation = 6;
  string fencing_token = 7;
  string home_session_id = 8;
}

// Home A 首次收到 B 的 P2P grant 时向 Meta 做权威验证。调用方必须把经
// 节点间认证得到的 peer 身份填入 observed_peer_node_id，不可照抄请求体。
// Meta 以持久权威状态核对出示凭证全部字段、B 当前 Node session、Home 当前
// session、授权代/权利及未撤权状态；无效或无法权威判断时返回错误，不返回假成功。
// A 缓存验证结果，后续同 grant 文件操作不逐次查询 Meta；撤权须先在 A 安装
// 拒绝旧授权的屏障并等待 ACK，不能仅靠 watch 延迟推断缓存已失效。
message ValidateRootAccessRequest {
  string request_id = 1;
  PresentedRootAccess presented_access = 2;
  string observed_peer_node_id = 3;
  string validator_home_node_id = 4;
  string validator_home_session_id = 5;
}

message ValidateRootAccessReply {
  RootAccess access = 1;
  uint64 authority_revision = 2;
}

message WatchRootCommandsRequest {
  string node_id = 1;
  string session_id = 2;
  uint64 after_revision = 3;
}

message RootCommand {
  string command_id = 1;
  RootCommandType command_type = 2;
  RootAccess access = 3;
  uint64 revision = 4;
}

message AckRevocationRequest {
  // Meta 只接受当前 Home 会话对相应 command 的成功 ACK 作为撤权提交屏障；
  // B 的 ACK、watch 投递或超时均不能代替 Home 已拒绝旧 grant 的证明。
  string request_id = 1;
  string command_id = 2;
  string node_id = 3;
  string session_id = 4;
  string root_id = 5;
  uint64 root_epoch = 6;
  uint64 access_generation = 7;
  bool success = 8;
  string message = 9;
}

message AckRevocationReply {
  uint64 accepted_at_unix_ms = 1;
}

// A 重启时先验证本机根身份记录和独占数据目录锁，再以新 Node session 请求恢复。
// Meta 比对已持久化的 home、root_epoch 与 ActivateRoot 的 local_prepare_id，
// 将旧 Home 会话和旧授权代围栏，完成必要的远端缓存屏障后才能返回新 grant。
// 同一个 request_id 的重试必须查询/复用原结果，不能多次推进授权代。
// 本 RPC 不从目录扫描结果创建新根，也不迁移 Home；Meta 不可达时失败关闭。
message RecoverRootRequest {
  string request_id = 1;
  string root_id = 2;
  uint64 expected_root_epoch = 3;
  string home_node_id = 4;
  string home_session_id = 5;
  string local_prepare_id = 6;
}

message RecoverRootReply {
  RootAccess access = 1;
}

// ===== DistributedFs namespace, immutable FileVersion and placement =====
// Meta never carries file content. A node publishes a new inode head only
// after local or replicated ChunkStore writes have produced durable receipts.
service DfsMeta {
  rpc Lookup(DfsLookupRequest) returns (DfsLookupReply);
  rpc Create(DfsCreateRequest) returns (DfsCreateReply);
  rpc OpenWrite(OpenDfsWriteRequest) returns (OpenDfsWriteReply);
  rpc RenewWriteLease(RenewDfsWriteLeaseRequest) returns (DfsWriteLeaseReply);
  rpc GetInode(GetDfsInodeRequest) returns (GetDfsInodeReply);
  rpc GetFileVersion(GetFileVersionRequest) returns (GetFileVersionReply);
  rpc GetPlacementSnapshot(GetDfsPlacementSnapshotRequest) returns (GetDfsPlacementSnapshotReply);
  rpc SyncInodeMetadata(SyncDfsInodeMetadataRequest) returns (SyncDfsInodeMetadataReply);
  rpc CommitFileVersion(CommitFileVersionRequest) returns (CommitFileVersionReply);
}

enum DfsLocalCopyPolicy {
  DFS_LOCAL_COPY_POLICY_UNSPECIFIED = 0;
  DFS_LOCAL_COPY_POLICY_REQUIRED = 1;
  DFS_LOCAL_COPY_POLICY_PREFERRED = 2;
  DFS_LOCAL_COPY_POLICY_NOT_REQUIRED = 3;
}

message DfsReplicationConfig {
  uint32 desired_copies = 1;
  uint32 sync_required_copies = 2;
  uint32 min_distinct_nodes = 3;
  uint32 min_distinct_failure_domains = 4;
  DfsLocalCopyPolicy local_copy = 5;
}

message DfsStorageDevice {
  string device_id = 1;
  uint64 device_epoch = 2;
  uint64 catalog_revision = 3;
  string failure_domain = 4;
}

message DfsReplicaTarget {
  string node_id = 1;
  uint64 node_epoch = 2;
  string data_endpoint = 3;
  DfsStorageDevice device = 4;
}

message DfsReplicaGroup {
  string replica_group_id = 1;
  uint64 placement_epoch = 2;
  repeated DfsReplicaTarget targets = 3;
}

message DfsPlacementSnapshot {
  uint64 revision = 1;
  DfsReplicationConfig replication = 2;
  repeated DfsReplicaGroup replica_groups = 3;
}

message DfsReplicaAck {
  string operation_id = 1;
  string chunk_id = 2;
  uint64 placement_revision = 3;
  uint64 placement_epoch = 4;
  string node_id = 5;
  uint64 node_epoch = 6;
  string device_id = 7;
  uint64 device_epoch = 8;
  uint64 catalog_revision = 9;
  uint64 persisted_bytes = 10;
  bytes verified_digest = 11;
}

enum DfsInodeKind {
  DFS_INODE_KIND_UNSPECIFIED = 0;
  DFS_INODE_KIND_REGULAR = 1;
  DFS_INODE_KIND_DIRECTORY = 2;
  DFS_INODE_KIND_SYMLINK = 3;
}

message DfsInodeAttributes {
  uint32 mode = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  uint32 nlink = 4;
  uint64 atime_unix_ms = 5;
  uint64 mtime_unix_ms = 6;
  uint64 ctime_unix_ms = 7;
}

message DfsInodeRecord {
  string namespace_id = 1;
  string inode_id = 2;
  DfsInodeKind kind = 3;
  DfsInodeAttributes attributes = 4;
  string head_version_id = 5;
  uint64 revision = 6;
}

message DfsExtent {
  uint64 file_offset = 1;
  uint64 length = 2;
  string chunk_id = 3;
  uint64 chunk_offset = 4;
}

message DfsLayoutRoot {
  string layout_root_id = 1;
  uint64 file_length = 2;
  repeated DfsExtent inline_extents = 3;
}

message DfsFileVersion {
  string version_id = 1;
  string inode_id = 2;
  string parent_version_id = 3;
  uint64 length = 4;
  string layout_root_id = 5;
  uint64 created_at_unix_ms = 6;
}

message DfsChunkReceipt {
  string operation_id = 1;
  string chunk_id = 2;
  uint64 chunk_length = 3;
  bytes content_digest = 4;
  reserved 5 to 8;
  uint64 placement_revision = 9;
  uint64 placement_epoch = 10;
  string replica_group_id = 11;
  repeated DfsReplicaAck durable_acks = 12;
}

message DfsWriteLease {
  string inode_id = 1;
  string owner_node_id = 2;
  string owner_session_id = 3;
  uint64 lease_epoch = 4;
  uint64 expires_at_unix_ms = 5;
}

enum DfsCommitMetadataMode {
  DFS_COMMIT_METADATA_MODE_UNSPECIFIED = 0;
  DFS_COMMIT_METADATA_MODE_DATA_ONLY = 1;
  DFS_COMMIT_METADATA_MODE_FULL = 2;
}

message DfsCommitMetadataDelta {
  DfsCommitMetadataMode mode = 1;
  uint64 mtime_unix_ms = 2;
  uint64 ctime_unix_ms = 3;
}

message DfsLookupRequest {
  string namespace_id = 1;
  string parent_inode_id = 2;
  bytes name = 3;
}

message DfsLookupReply {
  DfsInodeRecord inode = 1;
  bool found = 2;
}

message DfsCreateRequest {
  string caller_id = 1;
  string operation_id = 2;
  string namespace_id = 3;
  string parent_inode_id = 4;
  bytes name = 5;
  DfsInodeAttributes attributes = 6;
  string owner_session_id = 7;
  uint64 lease_seconds = 8;
}

message DfsCreateReply {
  DfsInodeRecord inode = 1;
  DfsWriteLease write_lease = 2;
}

message OpenDfsWriteRequest {
  string caller_id = 1;
  string owner_session_id = 2;
  string operation_id = 3;
  string inode_id = 4;
  uint64 lease_seconds = 5;
}

message OpenDfsWriteReply {
  DfsInodeRecord inode = 1;
  DfsWriteLease write_lease = 2;
}

message RenewDfsWriteLeaseRequest {
  string caller_id = 1;
  string owner_session_id = 2;
  string operation_id = 3;
  DfsWriteLease current_lease = 4;
  uint64 lease_seconds = 5;
}

message DfsWriteLeaseReply {
  DfsWriteLease write_lease = 1;
}

message GetDfsInodeRequest {
  string inode_id = 1;
}

message GetDfsInodeReply {
  DfsInodeRecord inode = 1;
}

message GetFileVersionRequest {
  string version_id = 1;
}

message GetFileVersionReply {
  DfsFileVersion version = 1;
  DfsLayoutRoot layout = 2;
}

message GetDfsPlacementSnapshotRequest {
  string caller_id = 1;
  uint64 minimum_revision = 2;
}

message GetDfsPlacementSnapshotReply {
  DfsPlacementSnapshot snapshot = 1;
}

message SyncDfsInodeMetadataRequest {
  string caller_id = 1;
  string operation_id = 2;
  string inode_id = 3;
  DfsWriteLease write_lease = 4;
  uint64 expected_inode_revision = 5;
  string expected_head_version_id = 6;
  DfsCommitMetadataDelta metadata_delta = 7;
}

message SyncDfsInodeMetadataReply {
  DfsInodeRecord inode = 1;
}

message CommitFileVersionRequest {
  string caller_id = 1;
  string operation_id = 2;
  string inode_id = 3;
  uint64 expected_inode_revision = 4;
  string expected_head_version_id = 5;
  DfsFileVersion version = 6;
  DfsLayoutRoot layout = 7;
  repeated DfsChunkReceipt chunk_receipts = 8;
  DfsWriteLease write_lease = 9;
  DfsCommitMetadataDelta metadata_delta = 10;
}

message CommitFileVersionReply {
  DfsInodeRecord inode = 1;
}
