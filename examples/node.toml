id = "node-a"
grpc_listen = "127.0.0.1:7500"
rest_listen = "127.0.0.1:7501"
meta_endpoint = "http://127.0.0.1:7400"
# peer_endpoint = "http://127.0.0.1:7600"
fs = "all"
data_mode = "grpc"
data_dir = "/tmp/afs-node-a/data"
uds_path = "/tmp/afs-node-a/local.sock"
# ownerfs_mount = "/tmp/afs-node-a/ownerfs-mnt"
# dfs_mount = "/tmp/afs-node-a/dfs-mnt"
timeout_ms = 5000
log_level = "info"
trace_enabled = false
trace_sample_ratio = 1.0
trace_endpoint = "http://127.0.0.1:4317"

# OwnerFs workspace bind mount stays OFF. This legacy option controls only
# the runc experiment; it does not expose a standalone host-visible bind.
# Existing TOML/CLI names remain compatible; see docs/architecture/ownerfs.md.
experimental_native_workspace = false
