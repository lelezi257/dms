<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img"><title>OwnerFs: a workspace stays on one Home node</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#526575"/></marker></defs><rect width="1100" height="500" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183246}.small{font-size:16px}.label{font-size:20px}.title{font-size:25px;font-weight:bold}.mono{font-family:Menlo,monospace;font-size:15px}</style><text x="35" y="42" class="title" text-anchor="start">OwnerFs: a workspace stays on one Home node</text><rect x="40" y="100" width="420" height="285" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="56" y="130" class="label" text-anchor="start">Node A: Home</text><text x="56" y="157" class="small" text-anchor="start">Application -&gt; OwnerFs mount</text><text x="56" y="180" class="small" text-anchor="start">Local file handles</text><text x="56" y="203" class="small" text-anchor="start">Ordinary local filesystem</text><text x="56" y="226" class="small" text-anchor="start">Workspace bytes stay here</text><rect x="640" y="100" width="420" height="285" rx="8" fill="#eef7fa" stroke="#7b9aab" stroke-width="1.5"/><text x="656" y="130" class="label" text-anchor="start">Node B</text><text x="656" y="157" class="small" text-anchor="start">Application -&gt; OwnerFs mount</text><text x="656" y="180" class="small" text-anchor="start">Remote file operations</text><text x="656" y="203" class="small" text-anchor="start">No second independent writer cache</text><path d="M640 285 L460 285" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/><text x="550.0" y="276.0" class="small" text-anchor="middle">Peer RPC</text><text x="40" y="450" class="small" text-anchor="start">Home placement favors 1-4 node workspaces. DFS inode ownership is a separate mechanism.</text></svg>