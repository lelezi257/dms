[workspace]
members = [
    "benchmarks/dms-bench",
    "common/error",
    "common/logging",
    "common/metrics",
    "common/shm",
    "common/tracing",
    "common/transport",
    "protocol",
    "sdk/rust/dms-client",
    "server",
    "server/homefs",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"

[patch.crates-io]
# fuser 0.16 parses FUSE_INTERRUPT but hard-codes ENOSYS instead of exposing it to
# Filesystem implementations. DMS needs that callback to cancel distributed F_SETLKW
# waiters without leaving a ghost lock request in Meta. The vendored patch only adds
# this missing callback and can be removed when upstream exposes equivalent support.
fuser = { path = "third_party/fuser" }
