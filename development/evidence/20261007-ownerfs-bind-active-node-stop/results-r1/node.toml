experimental_native_workspace = true
id = "node-a"
fs = "ownerfs"
meta_endpoint = "https://127.0.0.1:24400"
grpc_listen = "127.0.0.1:24500"
rest_listen = "127.0.0.1:24501"
advertise_endpoint = "https://127.0.0.1:24500"
data_dir = "/opt/afs-active-node-stop-20261007-r1/state/node"
uds_path = "/opt/afs-active-node-stop-20261007-r1/run/node.sock"
ownerfs_mount = "/opt/afs-active-node-stop-20261007-r1/mount/ownerfs"
data_mode = "grpc"
allow_volatile_meta = false
dfs_desired_copies = 1
dfs_sync_required_copies = 1
dfs_min_distinct_nodes = 1
dfs_min_distinct_failure_domains = 1
dfs_local_copy = "required"
log_level = "info"
trace_enabled = false

tls_ca_certificate = "/opt/afs-active-node-stop-20261007-r1/etc/tls/ca.pem"
