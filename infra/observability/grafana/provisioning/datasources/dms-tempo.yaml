apiVersion: 1

datasources:
  - name: DMS Tempo
    uid: dms-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: dms-loki
        filterByTraceID: true
        filterBySpanID: false
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
      serviceMap:
        datasourceUid: dms-prometheus
      nodeGraph:
        enabled: true
