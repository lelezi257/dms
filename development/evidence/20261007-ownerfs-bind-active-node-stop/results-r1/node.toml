trusted_node_certs = { node-a = "/opt/afs-active-node-stop-20261007-r1/etc/tls/node-a.pem" }

[native_workspace]
control_dir = "/opt/afs-active-node-stop-20261007-r1/control"
runtime = "/usr/local/sbin/runc"
rootfs = "/opt/afs-active-node-stop-20261007-r1/rootfs"
workload_uid = 501
