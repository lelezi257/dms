experimental_native_workspace = true
id = "node-a"
fs = "ownerfs"
meta_endpoint = "https://127.0.0.1:24800"
grpc_listen = "127.0.0.1:24900"
rest_listen = "127.0.0.1:24901"
advertise_endpoint = "https://127.0.0.1:24900"
data_dir = "/opt/afs-bind-node-startup-20261007-r2/state/node"
uds_path = "/opt/afs-bind-node-startup-20261007-r2/run/node.sock"
ownerfs_mount = "/opt/afs-bind-node-startup-20261007-r2/mount/ownerfs"
data_mode = "grpc"
allow_volatile_meta = true
dfs_desired_copies = 1
dfs_sync_required_copies = 1
dfs_min_distinct_nodes = 1
dfs_min_distinct_failure_domains = 1
dfs_local_copy = "required"
log_level = "info"
trace_enabled = false

tls_ca_certificate = "/opt/afs-bind-node-startup-20261007-r2/etc/tls/ca.pem"
tls_identity_certificate = "/opt/afs-bind-node-startup-20261007-r2/etc/tls/node-a.pem"
tls_identity_private_key = "/opt/afs-bind-node-startup-20261007-r2/etc/tls/node-a-key.pem"
tls_server_name = "afs-meta"
trusted_node_certs = { node-a = "/opt/afs-bind-node-startup-20261007-r2/etc/tls/node-a.pem" }

[native_workspace]
control_dir = "/opt/afs-bind-node-startup-20261007-r2/control"
runtime = "/opt/afs-bind-node-startup-20261007-r2/intentionally-absent-runc"
rootfs = "/opt/afs-bind-node-startup-20261007-r2/rootfs"
workload_uid = 501
workload_gid = 501
