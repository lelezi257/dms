<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img">
<title>Close-to-open: visibility and durable versions</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#526575"/></marker></defs>
<rect width="1100" height="620" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#183246}.small{font-size:16px}.label{font-size:20px}.title{font-size:25px;font-weight:bold}</style>
<text x="35" y="42" class="title">Close-to-open: visibility and durable versions</text>
<text x="25" y="155" class="label">User</text>
<path d="M115 150 L1060 150" stroke="#9cafbb" fill="none"/>
<text x="155" y="102" class="small" text-anchor="middle">open</text>
<path d="M155 114 L155 150" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="155" cy="150" r="4" fill="#176e8a"/>
<text x="285" y="102" class="small" text-anchor="middle">write</text>
<path d="M285 114 L285 150" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="285" cy="150" r="4" fill="#176e8a"/>
<text x="420" y="102" class="small" text-anchor="middle">read</text>
<path d="M420 114 L420 150" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="420" cy="150" r="4" fill="#176e8a"/>
<text x="540" y="102" class="small" text-anchor="middle">close</text>
<path d="M540 114 L540 150" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="540" cy="150" r="4" fill="#176e8a"/>
<text x="885" y="102" class="small" text-anchor="middle">return</text>
<path d="M885 114 L885 150" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="885" cy="150" r="4" fill="#176e8a"/>
<text x="1020" y="102" class="small" text-anchor="middle">open</text>
<path d="M1020 114 L1020 150" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="1020" cy="150" r="4" fill="#176e8a"/>
<text x="25" y="315" class="label">Node</text>
<path d="M115 310 L1060 310" stroke="#9cafbb" fill="none"/>
<text x="285" y="262" class="small" text-anchor="middle">dirty</text>
<path d="M285 274 L285 310" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="285" cy="310" r="4" fill="#176e8a"/>
<text x="420" y="262" class="small" text-anchor="middle">visible</text>
<path d="M420 274 L420 310" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="420" cy="310" r="4" fill="#176e8a"/>
<text x="565" y="262" class="small" text-anchor="middle">flush</text>
<path d="M565 274 L565 310" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="565" cy="310" r="4" fill="#176e8a"/>
<text x="655" y="262" class="small" text-anchor="middle">finalize</text>
<path d="M655 274 L655 310" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="655" cy="310" r="4" fill="#176e8a"/>
<text x="755" y="262" class="small" text-anchor="middle">replicate</text>
<path d="M755 274 L755 310" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="755" cy="310" r="4" fill="#176e8a"/>
<text x="930" y="262" class="small" text-anchor="middle">release</text>
<path d="M930 274 L930 310" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="930" cy="310" r="4" fill="#176e8a"/>
<text x="25" y="485" class="label">Meta</text>
<path d="M115 480 L1060 480" stroke="#9cafbb" fill="none"/>
<text x="815" y="432" class="small" text-anchor="middle">commit</text>
<path d="M815 444 L815 480" stroke="#526575" fill="none" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="815" cy="480" r="4" fill="#176e8a"/>
<path d="M540 165 L565 245" stroke="#9cafbb" fill="none" stroke-dasharray="4 5"/>
<path d="M755 330 L815 410" stroke="#9cafbb" fill="none" stroke-dasharray="4 5"/>
<path d="M815 460 L885 175" stroke="#9cafbb" fill="none" stroke-dasharray="4 5"/>
<text x="145" y="525" class="small">V7</text>
<text x="835" y="525" class="small">V8</text>
<text x="35" y="568" class="small">write: local visibility  |  commit: durable head  |  return: close completed  |  open: another mount</text>
</svg>
