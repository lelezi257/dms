[package]
name = "dms-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DMS node and metadata service components"
publish = false

[features]
default = []
# 可靠性专项构建开关：只在故障注入/混沌测试制品中启用，正式构建不包含故障注入代码。
reliability-faults = []
# 真实 Linux FUSE 内核接入穿刺。默认不开启，避免普通 KV/组件构建引入内核 FUSE 依赖。
fuse = ["dep:fuser"]

[dependencies]
axum = "0.8.6"
clap = { version = "4.5.51", features = ["derive"] }
crc32fast = "1.5.0"
dms-error = { path = "../common/error" }
dms-logging = { path = "../common/logging" }
dms-metrics = { path = "../common/metrics" }
dms-protocol = { path = "../protocol" }
dms-shm = { path = "../common/shm" }
dms-tracing = { path = "../common/tracing", features = ["runtime"] }
dms-transport = { path = "../common/transport" }
# abi-7-28+ 才会在 INIT 中协商 max_pages。没有它时 Linux 会把大 I/O 固定拆成
# 约 128 KiB callback，write-through 因而对 1 MiB 写执行多次 Meta commit。
fuser = { version = "0.16.0", optional = true, features = ["abi-7-31"] }
libc = "0.2"
prost = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
slog = { version = "2.8.2", features = ["max_level_trace", "release_max_level_trace"] }
slog-global = { git = "https://github.com/tikv/slog-global.git", rev = "d592f88e4dbba5eb439998463054f1a44fbf17b9", features = ["log"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = "0.14.6"
toml = "0.9.8"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
dms-client = { path = "../sdk/rust/dms-client" }
serde_json = "1.0.145"

[lints]
workspace = true
