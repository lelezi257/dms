name: AFS foundation CI

on:
  push:
    branches: [main, feat/agent-workloads-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只验证基础 crate；产品后端尚未实现。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node.js 24
        with:
          persist-credentials: false
      - name: Load pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked --workspace --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
