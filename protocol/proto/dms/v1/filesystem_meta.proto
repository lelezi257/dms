syntax = "proto3";

package dms.v1;

import "dms/v1/types.proto";
import "dms/v1/node_meta.proto";

// Node 内置 Filesystem 使用的独立元数据服务。
//
// 它与对象 MetadataService 运行在同一个 dms-meta 进程、共享同一个 MetaState，
// 但不把 inode/dentry 语义混入对象版本 API。首条共享文件主链只需要 lookup、
// create、resolve 和原子文件版本提交；后续 POSIX 操作在同一 service 内扩展。
service FilesystemMetadataService {
  rpc LookupFilesystemEntry(FilesystemLookupRequest) returns (FilesystemResolveResponse);
  rpc GetFilesystemInode(FilesystemGetInodeRequest) returns (FilesystemResolveResponse);
  rpc CreateFilesystemInode(FilesystemCreateInodeRequest) returns (FilesystemResolveResponse);
  rpc CreateFilesystemSymlink(FilesystemCreateSymlinkRequest) returns (FilesystemResolveResponse);
  rpc ReadFilesystemDirectory(FilesystemReadDirectoryRequest) returns (FilesystemReadDirectoryResponse);
  rpc LinkFilesystemEntry(FilesystemLinkRequest) returns (FilesystemNamespaceMutationResponse);
  rpc AcquireFilesystemInodeReference(FilesystemInodeReferenceRequest) returns (FilesystemInodeReferenceResponse);
  rpc RenewFilesystemInodeReferences(FilesystemRenewInodeReferencesRequest) returns (FilesystemInodeReferenceResponse);
  rpc ReleaseFilesystemInodeReference(FilesystemInodeReferenceRequest) returns (FilesystemInodeReferenceResponse);
  rpc RenameFilesystemEntry(FilesystemRenameRequest) returns (FilesystemNamespaceMutationResponse);
  rpc RemoveFilesystemEntry(FilesystemRemoveRequest) returns (FilesystemNamespaceMutationResponse);
  // M1.4 属性纵向切片：Meta 在同一条 WAL 中完成授权、属性更新、revision
  // 推进与失效事件发布。
  rpc SetFilesystemAttributes(FilesystemSetAttributesRequest) returns (FilesystemAttributeMutationResponse);
  // xattr/ACL 与集群容量同样由 Meta 权威状态提供；Node/FUSE 只做领域值和
  // wire/errno 的边界转换，不保存第二份 xattr 或容量状态。
  rpc GetFilesystemXattr(FilesystemGetXattrRequest) returns (FilesystemGetXattrResponse);
  rpc ListFilesystemXattrs(FilesystemListXattrsRequest) returns (FilesystemListXattrsResponse);
  rpc SetFilesystemXattr(FilesystemSetXattrRequest) returns (FilesystemAttributeMutationResponse);
  rpc RemoveFilesystemXattr(FilesystemRemoveXattrRequest) returns (FilesystemAttributeMutationResponse);
  rpc StatFilesystem(FilesystemStatRequest) returns (FilesystemStatResponse);
  rpc CommitFilesystemVersion(FilesystemCommitVersionRequest) returns (FilesystemCommitVersionResponse);
}

enum FilesystemInodeKind {
  FILESYSTEM_INODE_KIND_UNSPECIFIED = 0;
  FILESYSTEM_INODE_KIND_REGULAR_FILE = 1;
  FILESYSTEM_INODE_KIND_DIRECTORY = 2;
  FILESYSTEM_INODE_KIND_SYMBOLIC_LINK = 3;
}

message FilesystemContentBinding {
  bytes object_key = 1;
  uint64 exact_version = 2;
}

message FilesystemInodeAttributes {
  uint64 inode = 1;
  FilesystemInodeKind kind = 2;
  uint32 mode = 3;
  uint32 uid = 4;
  uint32 gid = 5;
  uint32 link_count = 6;
  uint64 size = 7;
  int64 atime_unix_nanos = 8;
  int64 mtime_unix_nanos = 9;
  int64 ctime_unix_nanos = 10;
}

// 由可信 Node 从 FUSE Request 提取的 POSIX 调用者身份。
// principal 字符串不能替代 uid/gid 权限判断；capability/group 扩展后续增加新字段。
message FilesystemCallerIdentity {
  uint32 uid = 1;
  uint32 gid = 2;
  uint32 pid = 3;
}

enum FilesystemTimeUpdateKind {
  FILESYSTEM_TIME_UPDATE_KIND_UNSPECIFIED = 0;
  FILESYSTEM_TIME_UPDATE_KIND_OMIT = 1;
  FILESYSTEM_TIME_UPDATE_KIND_NOW = 2;
  FILESYSTEM_TIME_UPDATE_KIND_EXACT = 3;
}

message FilesystemTimeUpdate {
  FilesystemTimeUpdateKind kind = 1;
  // 仅 EXACT 使用。NOW 必须在 Meta actor turn 中解析，保证重试与其它 attrs
  // 共用一次权威提交。
  int64 exact_unix_nanos = 2;
}

// ctime 不在 patch 中；它始终由 Meta mutation 自动生成。
message FilesystemAttributePatch {
  optional uint32 mode = 1;
  optional uint32 uid = 2;
  optional uint32 gid = 3;
  optional FilesystemTimeUpdate atime = 4;
  optional FilesystemTimeUpdate mtime = 5;
}

message FilesystemInodeSnapshot {
  uint64 revision = 1;
  FilesystemInodeAttributes attributes = 2;
  optional FilesystemContentBinding content = 3;
  // 预留只描述未来 DATA 的容量保证，不是可读 Extent。Node incarnation 是
  // local-memory reservation 的 fencing 身份；Node 重启后旧预留不能继续兑现。
  repeated FilesystemSpaceReservation reservations = 4;
}

message FilesystemSpaceReservation {
  bytes reservation_id = 1;
  uint64 node_id = 2;
  uint64 node_epoch = 3;
  uint64 offset = 4;
  uint64 length = 5;
}

// CommitFilesystemVersion 中 reservation 的范围增量。owner 不由调用方填写，
// Meta 从已经校验的 NodeSessionIdentity 取得，避免伪造其它 Node 的容量承诺。
message FilesystemReservationRange {
  bytes reservation_id = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

message FilesystemDentrySnapshot {
  uint64 parent = 1;
  bytes name = 2;
  uint64 inode = 3;
  uint64 directory_revision = 4;
}

message FilesystemCacheGrant {
  uint64 generation = 1;
  uint64 lease_millis = 2;
}

// 对一个目录 namespace 快照的短期缓存授权。directory_revision 也是目录 inode
// revision；generation 用于抵御乱序 revoke，lease 用于 Watch 断流后的有界失效。
message FilesystemDirectoryGrant {
  uint64 directory_revision = 1;
  FilesystemCacheGrant cache = 2;
}

message FilesystemResolvedInode {
  FilesystemInodeSnapshot inode = 1;
  FilesystemCacheGrant grant = 2;
  // 普通文件带回精确版本的完整读取计划。Node 在 grant 有效期内缓存该计划，
  // 热读不需要再调用对象 ResolveObject。
  optional ResolveObjectResponse object = 3;
}

message FilesystemLookupRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  uint64 parent = 3;
  bytes name = 4;
  // lookup 命中会给 FUSE 返回 entry，并隐含 nlookup=1。Meta 必须在同一 actor
  // turn 建立保护，不能等 Node 再发第二个 acquire。
  uint64 reference_generation = 5;
}

message FilesystemGetInodeRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  uint64 inode = 3;
}

message FilesystemCreateInodeRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  bytes operation_id = 3;
  uint64 parent = 4;
  bytes name = 5;
  FilesystemInodeKind kind = 6;
  uint32 mode = 7;
  uint32 uid = 8;
  uint32 gid = 9;
  optional uint64 expected_parent_revision = 10;
  bytes operation_digest = 11;
  uint64 commit_sequence = 12;
  // FUSE create/mkdir/symlink/link 成功返回 entry 时，内核隐含 nlookup=1。
  // 该引用必须和 namespace mutation 在同一个 Meta actor turn 中建立，避免
  // path 可见后、单独 acquire 前被 orphan reaper 观察到无引用。
  uint64 reference_generation = 13;
}

message FilesystemCreateSymlinkRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  bytes operation_id = 3;
  bytes operation_digest = 4;
  uint64 parent = 5;
  bytes name = 6;
  uint32 uid = 7;
  uint32 gid = 8;
  optional uint64 expected_parent_revision = 9;
  uint64 commit_sequence = 10;
  bytes object_key = 11;
  VersionCandidate candidate = 12;
  repeated ReplicaProof replica_proofs = 13;
  repeated ReplicaReport new_replicas = 14;
  uint64 target_size = 15;
  int64 mtime_unix_nanos = 16;
  uint64 reference_generation = 17;
}

message FilesystemResolveResponse {
  bool found = 1;
  optional FilesystemResolvedInode resolved = 2;
  optional FilesystemDentrySnapshot dentry = 3;
  optional FilesystemDirectoryGrant directory_grant = 4;
  uint64 entry_reference_lease_millis = 5;
  uint64 entry_reference_generation = 6;
}

message FilesystemDirectoryEntry {
  FilesystemDentrySnapshot dentry = 1;
  FilesystemInodeAttributes attributes = 2;
}

// cursor 是上一页最后一个名字，不是数组下标。后续页必须携带首屏返回的 revision；
// 若目录已变化，Meta 返回冲突，Node 从第一页重新读取，避免重复或漏项。
message FilesystemReadDirectoryRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  uint64 directory = 3;
  bytes cursor = 4;
  uint32 limit = 5;
  optional uint64 expected_directory_revision = 6;
}

message FilesystemReadDirectoryResponse {
  FilesystemDirectoryGrant directory_grant = 1;
  repeated FilesystemDirectoryEntry entries = 2;
  bytes next_cursor = 3;
  bool has_more = 4;
  // root 的 parent 仍为 root；FUSE 用它生成 `..`，不在本地猜测目录关系。
  uint64 parent = 5;
}

message FilesystemRenameRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  bytes operation_id = 3;
  bytes operation_digest = 4;
  uint64 source_parent = 5;
  bytes source_name = 6;
  uint64 target_parent = 7;
  bytes target_name = 8;
  optional uint64 expected_source_revision = 9;
  optional uint64 expected_target_revision = 10;
  uint64 commit_sequence = 11;
  bool replace_existing = 12;
}

message FilesystemLinkRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  bytes operation_id = 3;
  bytes operation_digest = 4;
  uint64 source_inode = 5;
  uint64 target_parent = 6;
  bytes target_name = 7;
  optional uint64 expected_target_revision = 8;
  uint64 commit_sequence = 9;
  uint64 reference_generation = 10;
}

message FilesystemInodeReferenceRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  uint64 inode = 3;
  // Node 本地 0->1 acquire 时递增；release 只释放同一 generation，避免迟到
  // release 删除后续重新 acquire 的保护。
  uint64 reference_generation = 4;
}

message FilesystemInodeReferenceLease {
  uint64 inode = 1;
  uint64 reference_generation = 2;
}

message FilesystemRenewInodeReferencesRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  // Node 本地只在 0->1 持有时向 Meta 建立租约；续租时批量上报当前仍活跃的
  // `(inode, generation)`，Meta 只延长匹配 generation 的条目。
  repeated FilesystemInodeReferenceLease references = 3;
}

message FilesystemInodeReferenceResponse {
  uint64 lease_millis = 1;
}

enum FilesystemRemoveKind {
  FILESYSTEM_REMOVE_KIND_UNSPECIFIED = 0;
  FILESYSTEM_REMOVE_KIND_FILE = 1;
  FILESYSTEM_REMOVE_KIND_DIRECTORY = 2;
}

message FilesystemRemoveRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  bytes operation_id = 3;
  bytes operation_digest = 4;
  uint64 parent = 5;
  bytes name = 6;
  FilesystemRemoveKind kind = 7;
  optional uint64 expected_parent_revision = 8;
  uint64 commit_sequence = 9;
}

message FilesystemDirectoryVersion {
  uint64 inode = 1;
  uint64 revision = 2;
  uint64 grant_generation = 3;
}

message FilesystemNamespaceMutationResponse {
  optional FilesystemDentrySnapshot dentry = 1;
  optional FilesystemInodeSnapshot inode = 2;
  repeated FilesystemDirectoryVersion changed_directories = 3;
  uint64 invalidation_cursor = 4;
  uint64 commit_index = 5;
  repeated FilesystemDirectoryVersion changed_inodes = 6;
  uint64 entry_reference_lease_millis = 7;
  uint64 entry_reference_generation = 8;
}

message FilesystemSetAttributesRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  bytes operation_id = 3;
  bytes operation_digest = 4;
  uint64 inode = 5;
  uint64 expected_inode_revision = 6;
  FilesystemCallerIdentity caller = 7;
  FilesystemAttributePatch patch = 8;
  uint64 commit_sequence = 9;
}

message FilesystemAttributeMutationResponse {
  FilesystemResolvedInode resolved = 1;
  uint64 invalidation_cursor = 2;
  uint64 commit_index = 3;
}

enum FilesystemXattrSetMode {
  FILESYSTEM_XATTR_SET_MODE_UNSPECIFIED = 0;
  FILESYSTEM_XATTR_SET_MODE_UPSERT = 1;
  FILESYSTEM_XATTR_SET_MODE_CREATE_ONLY = 2;
  FILESYSTEM_XATTR_SET_MODE_REPLACE_ONLY = 3;
}

message FilesystemGetXattrRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  uint64 inode = 3;
  bytes name = 4;
  FilesystemCallerIdentity caller = 5;
}

message FilesystemGetXattrResponse {
  bool found = 1;
  bytes value = 2;
  uint64 inode_revision = 3;
}

message FilesystemListXattrsRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  uint64 inode = 3;
  FilesystemCallerIdentity caller = 4;
}

message FilesystemListXattrsResponse {
  repeated bytes names = 1;
  uint64 inode_revision = 2;
}

message FilesystemSetXattrRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  bytes operation_id = 3;
  bytes operation_digest = 4;
  uint64 inode = 5;
  uint64 expected_inode_revision = 6;
  FilesystemCallerIdentity caller = 7;
  bytes name = 8;
  bytes value = 9;
  FilesystemXattrSetMode mode = 10;
  uint64 commit_sequence = 11;
}

message FilesystemRemoveXattrRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  bytes operation_id = 3;
  bytes operation_digest = 4;
  uint64 inode = 5;
  uint64 expected_inode_revision = 6;
  FilesystemCallerIdentity caller = 7;
  bytes name = 8;
  uint64 commit_sequence = 9;
}

message FilesystemStatRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
}

message FilesystemStatResponse {
  uint64 block_size = 1;
  uint64 total_blocks = 2;
  uint64 free_blocks = 3;
  uint64 available_blocks = 4;
  uint64 total_inodes = 5;
  uint64 free_inodes = 6;
  uint32 max_name_length = 7;
  uint32 reporting_nodes = 8;
  uint64 capacity_revision = 9;
}

message FilesystemCommitVersionRequest {
  RequestContext context = 1;
  NodeSessionIdentity session = 2;
  bytes operation_id = 3;
  bytes operation_digest = 4;
  uint64 inode = 5;
  uint64 expected_inode_revision = 6;
  bytes object_key = 7;
  optional uint64 expected_object_version = 8;
  VersionCandidate candidate = 9;
  repeated ReplicaProof replica_proofs = 10;
  repeated ReplicaReport new_replicas = 11;
  uint64 new_size = 12;
  int64 mtime_unix_nanos = 13;
  uint64 commit_sequence = 14;
  // size 与 chmod/chown/utimens 同时出现时必须由一次 commit 原子发布，
  // 不能在内容版本之后再发第二次属性 mutation。
  optional FilesystemCallerIdentity caller = 15;
  optional FilesystemAttributePatch attribute_patch = 16;
  repeated FilesystemReservationRange reservation_additions = 17;
  repeated FilesystemReservationRange reservation_reductions = 18;
}

message FilesystemCommitVersionResponse {
  FilesystemResolvedInode resolved = 1;
  uint64 invalidation_cursor = 2;
  uint64 commit_index = 3;
}
