id = "node-a"
fs = "all"
meta_endpoint = "https://127.0.0.1:7400"
grpc_listen = "127.0.0.1:7500"
rest_listen = "127.0.0.1:7501"
advertise_endpoint = "https://127.0.0.1:7500"
data_dir = "/var/lib/afs/node"
uds_path = "/run/afs/node.sock"
dfs_mount = "/mnt/afs/dfs"
ownerfs_mount = "/mnt/afs/ownerfs"
data_mode = "grpc"
allow_volatile_meta = false
dfs_desired_copies = 1
dfs_sync_required_copies = 1
dfs_min_distinct_nodes = 1
dfs_min_distinct_failure_domains = 1
dfs_local_copy = "required"
log_level = "info"
trace_enabled = false

tls_ca_certificate = "/etc/afs/tls/ca.pem"
tls_identity_certificate = "/etc/afs/tls/node-a.pem"
tls_identity_private_key = "/etc/afs/tls/node-a-key.pem"
tls_server_name = "afs-meta"
trusted_node_certs = { node-a = "/etc/afs/tls/node-a.pem" }
